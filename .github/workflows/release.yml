name: Release

# 打 tag（v*）时：为 Windows / Linux / macOS 各构建一个可直接运行的 demo jar，
# 并上传到 GitHub Release。
#
# Gitee 侧不在这里处理：代码由 Gitee 的「仓库镜像管理」从 GitHub 拉取同步，
# 发行版与三个平台的附件由 Gitee Go 流水线（.workflow/publish-gitee.yml）负责。
#
# 触发：推送 v* tag，或手动 workflow_dispatch。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: demo jar (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # openjfx 11 的分类器只有 win / linux / mac（x86_64）
        platform: [ win, linux, mac ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建 ${{ matrix.platform }} 版
        # 把对应平台的 openjfx（含原生库）打进 fat jar
        run: mvn -B -ntp -DskipTests -Djavafx.platform=${{ matrix.platform }} package

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp demo/target/spring-javafx-demo.jar \
             "dist/spring-javafx-demo-${{ matrix.platform }}-x64.jar"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.platform }}
          path: dist/*.jar
          if-no-files-found: error

  publish:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 解析 tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将发布：$TAG"
          ls -lh dist

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，仅补充/覆盖附件"
          else
            gh release create "$TAG" --title "spring-javafx $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.jar --clobber
