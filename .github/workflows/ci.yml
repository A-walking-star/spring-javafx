name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # core 以 JDK 8 为基线；11/17 走 jdk11-plus-compile profile 用 openjfx 编译
        java: [ '8', '11', '17' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test
        # Linux 上要用 linux 分类的 openjfx（JDK 11+ profile 依赖它做编译期依赖）
        run: mvn -B -ntp -Djavafx.platform=linux verify

      - name: Upload demo jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: spring-javafx-demo
          path: demo/target/spring-javafx-demo.jar
          if-no-files-found: warn
