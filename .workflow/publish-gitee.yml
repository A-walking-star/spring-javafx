version: "1.0"
name: publish-gitee
displayName: 发布 Gitee 发行版附件
stages:
- name: 构建并上传附件
  displayName: 构建并上传附件
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: build@maven
    name: publish_gitee_assets
    displayName: 构建并上传
    jdkVersion: "17"
    mavenVersion: 3.9.9
    commands:
    - 'echo "PUBLISH_TOKEN 是否注入：$([ -n "${PUBLISH_TOKEN}" ] && echo yes || echo no)"'
    - 'PUBLISH_TOKEN="${PUBLISH_TOKEN}" TAG="${TAG}" bash tools/ci-publish-gitee.sh'
    settings: []
    caches:
    - "~/.m2"
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    tags:
      prefix:
      - v
      precise: []
      include: []
notify: []
ref_variable:
- PUBLISH_TOKEN
