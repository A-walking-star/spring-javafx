version: '1.0'
name: publish-gitee
displayName: 发布 Gitee 发行版附件
# Gitee 侧的流水线：从 GitHub 镜像同步过来之后，给对应 tag 的 Gitee 发行版
# 补上 Windows / Linux / macOS 三个平台的 demo jar。
#
# 为什么放在 Gitee 侧跑：GitHub 的 runner 往 Gitee 传 40MB+ 的附件基本传不动。
#
# 触发方式：只监听 tag 推送（v*）。先实测「镜像同步 tag 是否会触发 push 事件」；
# 如果不会触发，再加一条定时触发兜底（注意 Gitee 的 cron 是本机校验的，
# 5 段写法 '0 3 * * ?' 会报「定时任务表达式无效」，加的时候改成 6 段 Quartz 写法：
#   schedule:
#     - cron: '0 0 3 * * ?'
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - v
stages:
  - name: publish-assets
    displayName: 构建并上传附件
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      # 用 maven 插件是为了直接拿到 JDK 17 + Maven 的构建环境；
      # 真正的逻辑在 tools/ci-publish-gitee.sh 里（先查发行版与已有附件，缺什么构建什么）。
      - step: build@maven
        name: publish_gitee_assets
        displayName: 构建并上传
        jdkVersion: '17'
        mavenVersion: 3.9.9
        commands:
          - GITEE_TOKEN="${GITEE_TOKEN}" TAG="${TAG}" bash tools/ci-publish-gitee.sh
        settings: []
        caches:
          - ~/.m2
        notify: []
        strategy:
          retry: '0'
